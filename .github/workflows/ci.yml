name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package with dev and optional extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,formats,api,ml]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Integrity watchdog (blocking gate)
        run: python scripts/watchdog.py

      - name: Tests
        run: pytest -q

  types:
    name: types (mypy, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the package with dev and optional extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,formats,api,ml]"

      - name: Type check
        run: mypy src/sorbed
