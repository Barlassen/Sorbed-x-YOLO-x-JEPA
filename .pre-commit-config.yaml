# Sorbed pre-commit hooks. Install once with `pre-commit install`.
# Run against everything with `pre-commit run --all-files`.
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml

  - repo: local
    hooks:
      - id: watchdog
        name: sorbed integrity watchdog
        entry: python scripts/watchdog.py
        language: system
        pass_filenames: false
        always_run: true
