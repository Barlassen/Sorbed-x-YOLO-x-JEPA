[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sorbed"
description = "Explainable pressure-injury (bedsore) image analysis and grading."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ariorad Moniri", email = "32umutkk@gmail.com" }]
keywords = [
    "wound-care", "pressure-injury", "pressure-ulcer", "bedsore",
    "medical-imaging", "segmentation", "decision-support", "explainable-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dynamic = ["version"]

# Core runtime. Everything here is permissively licensed and CPU-only. The
# system runs end-to-end on just these — the classical, weight-free backend
# needs nothing more.
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "scikit-image>=0.21",
    "scipy>=1.10",
    "opencv-python-headless>=4.8",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "typer>=0.12",
    "rich>=13.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# HEIC/HEIF (iPhone photos), DICOM, camera RAW, and multipage/BigTIFF decoders.
formats = [
    "pillow-heif>=0.16",
    "pydicom>=2.4",
    "tifffile>=2024.1.30",
    "imagecodecs>=2024.1.1",
    "rawpy>=0.19",
]
# Optional learned segmentation/staging backends. The classical backend keeps
# working without any of these.
ml = [
    "onnxruntime>=1.17",
    "scikit-learn>=1.3",
]
# Real pretrained models from the HuggingFace Hub (SAM / MedSAM segmentation).
hf = [
    "torch>=2.0",
    "transformers>=4.40",
    "huggingface-hub>=0.23",
]
# PDF clinician reports. Templates are pure-string HTML with inlined fonts,
# images, and SVG charts; headless Chromium (via Playwright) prints them to PDF.
pdf = [
    "playwright>=1.40",
]
# The FastAPI service.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]
all = [
    "sorbed[formats,ml,pdf,api,hf]",
]

[project.urls]
Homepage = "https://github.com/ArioMoniri/Sorbed"
Repository = "https://github.com/ArioMoniri/Sorbed"
Issues = "https://github.com/ArioMoniri/Sorbed/issues"
Changelog = "https://github.com/ArioMoniri/Sorbed/blob/main/CHANGELOG.md"

[project.scripts]
sorbed = "sorbed.cli.main:app"

[tool.hatch.version]
path = "src/sorbed/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sorbed"]
artifacts = [
    "src/sorbed/visualize/fonts/*.ttf",
    "src/sorbed/visualize/fonts/*.txt",
    "src/sorbed/report/assets/fonts/*.ttf",
    "src/sorbed/report/assets/fonts/*.txt",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "N802", "N803", "N806",  # allow clinical/mathematical variable names
    "RUF001", "RUF002", "RUF003",  # intentional unicode (×, em-dash) in display strings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "N"]
# These modules are almost entirely CSS/HTML string literals; wrapping markup at
# 100 columns hurts readability without benefit.
"src/sorbed/report/theme.py" = ["E501"]
"src/sorbed/report/templates.py" = ["E501"]
"src/sorbed/report/svg.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["sorbed"]
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
# Optional third-party stacks without type stubs.
[[tool.mypy.overrides]]
module = [
    "cv2.*", "skimage.*", "scipy.*", "PIL.*", "pillow_heif.*",
    "pydicom.*", "tifffile.*", "rawpy.*", "onnxruntime.*", "playwright.*", "fitz.*",
    "sklearn.*", "torch.*", "transformers.*", "huggingface_hub.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
markers = [
    "slow: marks tests as slow",
    "requires_ml: needs the optional ml extra",
    "requires_formats: needs the optional formats extra",
]

[tool.coverage.run]
source = ["sorbed"]
branch = true
